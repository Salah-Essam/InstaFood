name: insta_food
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: 3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  get_it: ^8.2.0
  dio: ^5.9.0
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  flutter_svg: ^2.2.0
  go_router: ^16.2.0
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  connectivity_plus: ^6.1.5
  carousel_slider: ^5.1.1
  flutter_screenutil: ^5.9.3
  
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  analyzer: ^5.13.0 
flutter:

  uses-material-design: true
  fonts:
    - family: LeagueSpartan
      fonts:
        - asset: assets/fonts/LeagueSpartan-Regular.ttf

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/icons/
    - assets/images/

  #   - images/a_dot_ham.jpeg 